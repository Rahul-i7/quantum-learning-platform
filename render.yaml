services:
  - type: web
    name: quantum-simulation
    runtime: python
    rootDir: services/simulation
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: quantum-content-progress
    runtime: python
    rootDir: services/content-progress
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SIMULATION_SERVICE_URL
        value: https://quantum-simulation-opbx.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: quantum-ai-tutor
    runtime: python
    rootDir: services/ai-tutor
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SIMULATION_SERVICE_URL
        value: https://quantum-simulation-opbx.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.9